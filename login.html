<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NurseIQ | Login</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>Nurse<span>IQ</span></h1>

                <p>Your nursing study companion</p>

            </div>


            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Log in to your NurseIQ account
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Log In

                </button>

            </form>


            <p
                id="message"
                style="text-align:center; margin-top:15px;">
            </p>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create an account
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← Back to NurseIQ

            </a>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // ==========================================
        // YOUR SUPABASE DETAILS
        // ==========================================

        const SUPABASE_URL =
            "https://kgzbhcficykryvphlykw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Pa9EkbHGw8KigGXqFfKe8w_mh-d24Ws";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                const message =
                    document.getElementById("message");


                message.textContent =
                    "Logging in...";


                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    message.textContent =
                        error.message;

                    message.style.color =
                        "red";

                    return;
                }


                message.textContent =
                    "Login successful!";

                message.style.color =
                    "green";


                // Send user to NurseIQ home

                window.location.href =
                    "home.html";

            });

    </script>

</body>

</html>
