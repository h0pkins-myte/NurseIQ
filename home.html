        const SUPABASE_KEY =

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // Check if user is logged in

        async function checkLogin() {

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();


            // If NOT logged in → send to login

            if (!session) {

                window.location.href =
                    "login.html";

            }

        }


        checkLogin();

    </script>
