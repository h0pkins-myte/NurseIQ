<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NurseIQ | Create Account</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="loader.css>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>Nurse<span>IQ</span></h1>
                <p>Your nursing study companion</p>
            </div>

            <h2>Create Account</h2>

            <p class="login-subtitle">
                Join NurseIQ today
            </p>

            <form id="signupForm">

                <div class="input-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="e.g hopkins@gmail.com"
                        required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="6 characters long"
                        minlength="6"
                        required>
                </div>

                <button type="submit" class="login-btn">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to NurseIQ
            </a>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://kgzbhcficykryvphlykw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Pa9EkbHGw8KigGXqFfKe8w_mh-d24Ws";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        document
            .getElementById("signupForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent =
                    "Creating account...";


                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,
                        password: password,

                        options: {
                            emailRedirectTo:
                                window.location.origin +
                                "/login.html"
                        }

                    });


                if (error) {

                    message.textContent =
                        error.message;

                    message.style.color = "red";

                    return;
                }


                message.textContent =
    "Account created....proceeding to login....";

message.style.color = "green";

setTimeout(() => {
    window.location.href = "login.html";
}, 1500);
                message.style.color = "green";

            });

    </script>

</body>

</html>
